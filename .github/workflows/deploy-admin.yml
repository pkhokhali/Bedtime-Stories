name: Deploy Admin Panel to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**' # Only trigger when changes are made inside the admin folder

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./admin
        run: npm install

      - name: Build Admin Portal
        working-directory: ./admin
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: bedtime-stories # Important: Ensure this matches your project name in Cloudflare
          directory: admin/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
